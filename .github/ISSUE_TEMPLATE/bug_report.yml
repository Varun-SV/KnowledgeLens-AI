name: Bug report
description: Report reproducible incorrect behavior in KnowledgeLens AI
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include what you expected and what occurred instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Start KnowledgeLens...\n2. Upload...\n3. Click..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.2.0 / commit SHA"
  - type: dropdown
    id: provider
    attributes:
      label: Endpoint type
      options:
        - Ollama
        - llama.cpp
        - OpenAI-compatible cloud
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/errors
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Security check
      options:
        - label: This report does not contain API keys, secrets, private documents, or sensitive graph exports.
          required: true
