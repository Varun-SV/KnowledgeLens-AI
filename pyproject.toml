[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgelens-ai"
version = "0.2.0"
description = "Source-backed knowledge graphs and graph-grounded chat for documents and code."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Varun S V"}]
dependencies = [
  "networkx>=3.4,<4",
  "pypdf>=6.4,<7",
  "pyvis>=0.3.2,<0.4",
  "requests>=2.32,<3",
  "streamlit>=1.52,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["knowledgelens*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
